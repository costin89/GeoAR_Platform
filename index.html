<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Geo-AR Fundament</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <video id="camera-preview" class="camera-preview" hidden playsinline muted></video>
    <canvas id="ar-canvas" class="ar-canvas"></canvas>

    <main class="app">
      <h1>Geo-AR Fundament</h1>
      <p class="intro">
        Prototyp 4: 2D-Canvas-Renderer – Geo-Anchors aus places.json als
        Marker/Pfeile über dem Kamerabild.
      </p>

      <div id="error-box" class="error-box" hidden></div>

      <button id="start-button" class="start-button" type="button">
        Rechte anfragen
      </button>

      <ul id="status-list" class="status-list"></ul>

      <div id="debug-overlay" class="debug-overlay"></div>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
