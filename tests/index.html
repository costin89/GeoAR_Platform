<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Mathe/Geo-Tests</title>
    <style>
      body {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #10141a;
        color: #e8ecf1;
        padding: 24px;
      }
      h1 {
        font-size: 1.2rem;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        margin-bottom: 4px;
        padding: 4px 8px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.05);
      }
      .pass {
        color: #3ecf7a;
      }
      .fail {
        color: #ff5c5c;
      }
      #summary {
        margin-top: 16px;
        font-weight: bold;
        font-size: 1.1rem;
      }
    </style>
  </head>
  <body>
    <h1>Mathe/Geo-Tests (Phase 3)</h1>
    <ul id="results"></ul>
    <div id="summary">läuft…</div>

    <script type="module">
      import { getResults, waitForAsyncTests } from "./runner.js";

      await import("./math/angle.test.js");
      await import("./math/vec3.test.js");
      await import("./math/quat.test.js");
      await import("./math/mat4.test.js");
      await import("./math/geo/haversine.test.js");
      await import("./math/geo/bearing.test.js");
      await import("./math/geo/enu.test.js");
      await import("./math/projection/perspective.test.js");
      await import("./math/projection/worldToScreen.test.js");
      await import("./trackers/geoTracker.test.js");
      await import("./scene/geoAnchor.test.js");
      await import("./render/renderer.test.js");
      await import("./scene/renderDistance.test.js");
      await import("./filters/lowpass.test.js");
      await import("./filters/angleLowpass.test.js");
      await import("./filters/complementary.test.js");
      await import("./sensors/compass.test.js");
      await import("./sensors/accelerometer.test.js");
      await import("./sensors/gyroscope.test.js");
      await import("./render/webgl/geometry.test.js");
      await import("./debug/compassRose.test.js");
      await import("./loaders/gltf/glbParser.test.js");
      await import("./loaders/gltf/gltfParser.test.js");
      await import("./loaders/gltf/accessorReader.test.js");
      await import("./loaders/gltf/meshBuilder.test.js");
      await import("./loaders/gltf/bufferLoader.test.js");
      await import("./loaders/gltf/gltfLoader.test.js");
      await import("./scene/modelAnchor.test.js");

      await waitForAsyncTests();
      const results = getResults();
      const list = document.getElementById("results");
      let passCount = 0;

      for (const result of results) {
        const li = document.createElement("li");
        li.className = result.passed ? "pass" : "fail";
        li.textContent = `${result.passed ? "✓" : "✗"} ${result.name}${
          result.error ? " — " + result.error : ""
        }`;
        list.appendChild(li);
        if (result.passed) passCount++;
      }

      const summary = document.getElementById("summary");
      summary.textContent = `${passCount} / ${results.length} Tests bestanden`;
      summary.className = passCount === results.length ? "pass" : "fail";
    </script>
  </body>
</html>
